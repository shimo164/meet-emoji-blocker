<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meet Emoji Blocker</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <div>
          <p class="eyebrow">Google Meet</p>
          <h1>Emoji Visibility</h1>
          <p class="subhead">Enable or disable each reaction emoji individually.</p>
        </div>
      </header>
      <section class="panel">
        <div class="panel-head">
          <h2>Reactions</h2>
        </div>
        <div class="list" id="emoji-list" role="list"></div>
      </section>
      <footer class="foot">
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
    </main>
    <script src="options.js"></script>
  </body>
</html>
